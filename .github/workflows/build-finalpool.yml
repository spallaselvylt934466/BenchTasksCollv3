name: Build Finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalpool
        uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 1

      - name: Checkout reviewed finalpool task sources
        uses: actions/checkout@v4
        with:
          repository: riverhe459-lgtm/BenchTasksCollv3-finalpool
          ref: finalpool
          path: .finalpool-reference
          fetch-depth: 1

      - name: Copy the reviewed implemented tasks
        run: |
          rm -rf tasks/finalpool
          mkdir -p tasks
          cp -a .finalpool-reference/tasks/finalpool tasks/finalpool

      - name: Validate finalpool
        run: |
          task_count=$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$task_count" -eq 79

      - name: Commit finalpool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/finalpool
          if git diff --cached --quiet; then
            echo "Finalpool is already populated."
            exit 0
          fi
          git commit -m "Add 79 implemented tasks to finalpool"
          git push origin HEAD:finalpool
